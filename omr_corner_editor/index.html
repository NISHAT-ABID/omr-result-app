<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/streamlit-component-lib/dist/index.js"></script>
<style>
  html, body { margin:0; padding:0; background:transparent; font-family:Arial,sans-serif; }
  .wrap { width:100%; }
  .hint { color:#9fb6b2; font-size:13px; margin:0 0 7px 2px; }
  .canvas { position:relative; width:100%; overflow:hidden; border-radius:7px; background:#111; user-select:none; touch-action:none; }
  img { display:block; width:100%; height:auto; pointer-events:none; }
  svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; touch-action:none; }
  .line { fill:none; stroke:#a8e800; stroke-width:4; vector-effect:non-scaling-stroke; }
  .handle { fill:#a8e800; stroke:#102018; stroke-width:3; vector-effect:non-scaling-stroke; cursor:grab; }
  .handle.dragging { fill:#ffd34d; cursor:grabbing; }
  .label { fill:#102018; font:700 14px Arial,sans-serif; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .status { margin-top:6px; color:#d8ebe7; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">Drag any numbered circle to correct the OMR corner.</div>
  <div id="canvas" class="canvas">
    <img id="photo">
    <svg id="svg"></svg>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
(function() {
  const Streamlit = window.Streamlit;
  const photo = document.getElementById("photo");
  const svg = document.getElementById("svg");
  const canvas = document.getElementById("canvas");
  const status = document.getElementById("status");

  let W = 1000, H = 1600;
  let points = [];
  let dragIndex = -1;
  let lastSent = "";

  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  function render() {
    if (!points.length) return;
    const poly = points.map(p => p[0] + "," + p[1]).join(" ");
    let html = '<polyline class="line" points="' + poly + '"></polyline>';
    points.forEach((p, i) => {
      html += '<circle class="handle" data-i="' + i + '" cx="' + p[0] + '" cy="' + p[1] + '" r="15"></circle>';
      html += '<text class="label" x="' + p[0] + '" y="' + p[1] + '">' + (i+1) + '</text>';
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = html;
    status.textContent = "1 Top-left  •  2 Top-right  •  3 Bottom-right  •  4 Bottom-left";
  }

  function setValue() {
    const payload = { points: points.map(p => [Math.round(p[0]*10)/10, Math.round(p[1]*10)/10]) };
    const serialized = JSON.stringify(payload);
    if (serialized !== lastSent) {
      lastSent = serialized;
      Streamlit.setComponentValue(payload);
    }
  }

  function pointerPos(ev) {
    const r = svg.getBoundingClientRect();
    return [
      Math.max(0, Math.min(W, (ev.clientX - r.left) * W / r.width)),
      Math.max(0, Math.min(H, (ev.clientY - r.top) * H / r.height))
    ];
  }

  svg.addEventListener("pointerdown", function(ev) {
    const target = ev.target.closest(".handle");
    if (!target) return;
    dragIndex = Number(target.dataset.i);
    target.classList.add("dragging");
    svg.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });

  svg.addEventListener("pointermove", function(ev) {
    if (dragIndex < 0) return;
    points[dragIndex] = pointerPos(ev);
    render();
    ev.preventDefault();
  });

  svg.addEventListener("pointerup", function(ev) {
    if (dragIndex < 0) return;
    dragIndex = -1;
    setValue();
    ev.preventDefault();
  });

  svg.addEventListener("pointercancel", function() {
    if (dragIndex >= 0) { dragIndex = -1; setValue(); }
  });

  function onRender(event) {
    const args = event.detail.args || {};
    W = Number(args.image_width || 1000);
    H = Number(args.image_height || 1600);
    photo.src = args.image || "";
    points = (args.points || []).map(p => [Number(p[0]), Number(p[1])]);
    lastSent = "";
    render();
    Streamlit.setFrameHeight(Math.min(1000, Math.max(260, Math.round(H * (canvas.clientWidth / W)) + 55)));
  }

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(600);
})();
</script>
</body>
</html>
