<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif}
.wrap{width:100%}.hint{color:#9fb6b2;font-size:13px;margin:0 0 7px 2px}
.canvas{position:relative;width:100%;overflow:hidden;border-radius:7px;background:#111;user-select:none;touch-action:none}
#photo{display:block;width:100%;height:auto;min-height:1px;pointer-events:none}

#svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none}
.line{fill:none;stroke:#a8e800;stroke-width:4;vector-effect:non-scaling-stroke}
.handle{fill:#a8e800;stroke:#102018;stroke-width:3;vector-effect:non-scaling-stroke;cursor:grab}
.handle.dragging{fill:#ffd34d;cursor:grabbing}
.label{fill:#102018;font:700 14px Arial,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.status{margin-top:6px;color:#d8ebe7;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">Drag any numbered circle to correct the OMR corner.</div>
  <div id="canvas" class="canvas"><img id="photo"><svg id="svg"></svg></div>
  <div class="status" id="status"></div>
</div>
<script>
(function(){
  // Self-contained Streamlit component protocol. No CDN/network dependency.
  const photo=document.getElementById('photo'), svg=document.getElementById('svg'), canvas=document.getElementById('canvas'), status=document.getElementById('status');
  let W=1000,H=1600,points=[],dragIndex=-1,lastSent='';

  function post(type, extra){
    const msg=Object.assign({isStreamlitMessage:true,type:type},extra||{});
    window.parent.postMessage(msg,'*');
  }
  function ready(){post('streamlit:componentReady',{apiVersion:1});}
  function frameHeight(){
    const cw = canvas.getBoundingClientRect().width || 1;
    const imageH = (W > 0 && H > 0) ? (cw * H / W) : 0;
    const extra = (document.querySelector('.hint')?.getBoundingClientRect().height || 0) +
                  (document.querySelector('.status')?.getBoundingClientRect().height || 0) + 22;
    const h = Math.ceil(Math.max(document.body.scrollHeight, imageH + extra));
    post('streamlit:setFrameHeight',{height:Math.max(330,Math.min(1600,h))});
  }
  window.addEventListener('resize',()=>setTimeout(frameHeight,50));
  function setValue(){
    const payload={points:points.map(p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10])};
    const s=JSON.stringify(payload);
    if(s!==lastSent){lastSent=s;post('streamlit:setComponentValue',{value:payload});}
  }
  function render(){
    if(points.length!==4)return;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    let html='<polyline class="line" points="'+points.map(p=>p[0]+','+p[1]).join(' ')+'"></polyline>';
    points.forEach((p,i)=>{
      html+='<circle class="handle" data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="18"></circle>';
      html+='<text class="label" x="'+p[0]+'" y="'+p[1]+'">'+(i+1)+'</text>';
    });
    svg.innerHTML=html;
    status.textContent='① Top-left   ② Top-right   ③ Bottom-right   ④ Bottom-left';
    requestAnimationFrame(frameHeight);
  }
  function pointerPos(ev){
    const r=svg.getBoundingClientRect();
    return [Math.max(0,Math.min(W,(ev.clientX-r.left)*W/r.width)),Math.max(0,Math.min(H,(ev.clientY-r.top)*H/r.height))];
  }
  svg.addEventListener('pointerdown',function(ev){
    const t=ev.target.closest('.handle'); if(!t)return;
    dragIndex=Number(t.dataset.i); t.setPointerCapture?.(ev.pointerId); ev.preventDefault();
    t.classList.add('dragging');
  });
  svg.addEventListener('pointermove',function(ev){
    if(dragIndex<0)return;
    points[dragIndex]=pointerPos(ev); render(); ev.preventDefault();
  });
  function endDrag(ev){if(dragIndex<0)return;dragIndex=-1;setValue();ev.preventDefault();}
  svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

  window.addEventListener('message',function(ev){
    const d=ev.data||{}; if(d.type!=='streamlit:render')return;
    const a=d.args||{};
    W=Number(a.image_width||1000);H=Number(a.image_height||1600);
    photo.onload=()=>{ requestAnimationFrame(()=>{ frameHeight(); render(); }); }; photo.src=a.image||'';
    points=(a.points||[]).map(p=>[Number(p[0]),Number(p[1])]);
    lastSent=JSON.stringify({points:points.map(p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10])});
    render();
  });
  ready(); frameHeight();
})();
</script>
</body>
</html>
