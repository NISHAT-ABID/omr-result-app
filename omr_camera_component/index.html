<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <style>
    html,body{margin:0;padding:0;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
    #app{position:relative;width:100%;height:100vh;min-height:560px;background:#000;display:flex;flex-direction:column}
    #stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
    #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #top{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 12px) 14px 14px;background:linear-gradient(#000b,transparent)}
    #status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#0009;font-size:14px;font-weight:650}
    #dot{width:9px;height:9px;border-radius:50%;background:#f0a44c}
    #dot.good{background:#18c49a;box-shadow:0 0 0 4px #18c49a22}
    #hint{margin-top:8px;font-size:12px;opacity:.86;text-shadow:0 1px 3px #000}
    #bottom{z-index:5;padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(transparent,#000e 24%);display:flex;align-items:center;justify-content:center;gap:18px}
    #capture{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#eee;box-shadow:0 2px 18px #0008;cursor:pointer;position:relative}
    #capture:after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
    #capture:disabled{opacity:.45;cursor:not-allowed}
    .small{position:absolute;left:14px;bottom:20px;color:#ddd;font-size:11px;opacity:.8}
    #error{position:absolute;z-index:20;inset:auto 14px 110px 14px;background:#2a1111;color:#ffdede;border:1px solid #7a3333;border-radius:12px;padding:12px;display:none}
    #loading{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#ddd}
    @media(min-width:700px){#app{max-width:760px;margin:auto;height:88vh;border-radius:18px;overflow:hidden}#stage{min-height:0}}
  </style>
  <script src="https://docs.opencv.org/4.x/opencv.js" async></script>
  <script src="https://unpkg.com/streamlit-component-lib@1.5.0/dist/index.js"></script>
</head>
<body>
<div id="app">
  <div id="loading">Opening camera…</div>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="top">
      <div id="status"><span id="dot"></span><span id="statusText">Looking for OMR sheet…</span></div>
      <div id="hint">Keep the FULL OMR sheet and all 4 corners inside the frame.</div>
    </div>
    <div id="error"></div>
  </div>
  <div id="bottom"><button id="capture" disabled aria-label="Capture"></button></div>
</div>
<script>
const video=document.getElementById('video'), overlay=document.getElementById('overlay'), ctx=overlay.getContext('2d');
const statusText=document.getElementById('statusText'), dot=document.getElementById('dot'), capture=document.getElementById('capture');
const loading=document.getElementById('loading'), errorBox=document.getElementById('error');
let stream=null, lastCorners=null, ready=false, cvReady=false, detecting=false, captured=false;

function setHeight(){ if(window.Streamlit) Streamlit.setFrameHeight(document.getElementById('app').scrollHeight); }
function showError(s){ errorBox.textContent=s; errorBox.style.display='block'; loading.style.display='none'; }
function orderPts(p){
  const pts=p.map(x=>({x:x.x,y:x.y}));
  const sum=pts.map(a=>a.x+a.y), diff=pts.map(a=>a.x-a.y);
  return [pts[sum.indexOf(Math.min(...sum))],pts[diff.indexOf(Math.max(...diff))],pts[sum.indexOf(Math.max(...sum))],pts[diff.indexOf(Math.min(...diff))]];
}
function resizeCanvas(){ const r=video.getBoundingClientRect(); overlay.width=Math.max(1,Math.floor(r.width*devicePixelRatio)); overlay.height=Math.max(1,Math.floor(r.height*devicePixelRatio)); overlay.style.width=r.width+'px';overlay.style.height=r.height+'px'; setHeight(); }
window.addEventListener('resize',resizeCanvas);

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;
    await video.play();
    loading.style.display='none'; resizeCanvas();
    setTimeout(()=>{ready=true; loop();},500);
  }catch(e){showError('Camera could not be opened. Please allow camera access in Chrome and try again.');}
}

function detect(){
  if(!cvReady||!ready||detecting||video.videoWidth<10) return;
  detecting=true;
  const W=720, H=Math.max(480,Math.round(W*video.videoHeight/video.videoWidth));
  const c=document.createElement('canvas'); c.width=W;c.height=H; const cctx=c.getContext('2d');cctx.drawImage(video,0,0,W,H);
  try{
    let src=cv.imread(c), gray=new cv.Mat(), blur=new cv.Mat(), edges=new cv.Mat(), contours=new cv.MatVector(), hier=new cv.Mat();
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY); cv.GaussianBlur(gray,blur,new cv.Size(5,5),0); cv.Canny(blur,45,140,edges);
    let kernel=cv.Mat.ones(5,5,cv.CV_8U); cv.dilate(edges,edges,kernel); cv.morphologyEx(edges,edges,cv.MORPH_CLOSE,kernel);
    cv.findContours(edges,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    let best=null,bestArea=0;
    for(let i=0;i<contours.size();i++){
      const cnt=contours.get(i), area=cv.contourArea(cnt); if(area< W*H*0.12 || area<bestArea) {cnt.delete();continue;}
      const peri=cv.arcLength(cnt,true), approx=new cv.Mat(); cv.approxPolyDP(cnt,approx,0.025*peri,true);
      if(approx.rows===4){
        const rr=cv.boundingRect(approx), ratio=rr.height/Math.max(1,rr.width);
        if(ratio>1.15 && ratio<3.5){best=approx;bestArea=area;}
        else approx.delete();
      } else approx.delete(); cnt.delete();
    }
    if(best){
      const raw=[]; for(let i=0;i<4;i++) raw.push({x:best.intPtr(i,0)[0],y:best.intPtr(i,0)[1]});
      lastCorners=orderPts(raw).map(p=>({x:p.x/W,y:p.y/H}));
      drawCorners(lastCorners); statusText.textContent='OMR sheet detected ✓'; dot.classList.add('good'); capture.disabled=false;
      best.delete();
    }else{lastCorners=null;drawCorners(null);statusText.textContent='Looking for OMR sheet…';dot.classList.remove('good');capture.disabled=true;}
    src.delete();gray.delete();blur.delete();edges.delete();contours.delete();hier.delete();kernel.delete();
  }catch(e){}
  detecting=false;
}
function drawCorners(c){
  ctx.clearRect(0,0,overlay.width,overlay.height); if(!c)return;
  ctx.save();ctx.scale(overlay.width,overlay.height);ctx.lineWidth=4/Math.min(overlay.width,overlay.height)*2;ctx.strokeStyle='#18d3aa';ctx.fillStyle='#18d3aa';ctx.shadowColor='#000';ctx.shadowBlur=5;
  ctx.beginPath();ctx.moveTo(c[0].x,c[0].y);for(let i=1;i<4;i++)ctx.lineTo(c[i].x,c[i].y);ctx.closePath();ctx.stroke();
  for(const p of c){ctx.beginPath();ctx.arc(p.x,p.y,0.012,0,Math.PI*2);ctx.fill();}ctx.restore();
}
function loop(){if(captured)return;detect();setTimeout(loop,280);}

async function processCapture(){
  if(!lastCorners||captured)return; captured=true; capture.disabled=true; statusText.textContent='Processing OMR…';
  const vw=video.videoWidth, vh=video.videoHeight;
  const source=document.createElement('canvas'); source.width=vw;source.height=vh;source.getContext('2d').drawImage(video,0,0,vw,vh);
  let resultCanvas=document.createElement('canvas');
  try{
    const pts=lastCorners.map(p=>({x:p.x*vw,y:p.y*vh}));
    const topW=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y), botW=Math.hypot(pts[2].x-pts[3].x,pts[2].y-pts[3].y);
    const leftH=Math.hypot(pts[3].x-pts[0].x,pts[3].y-pts[0].y), rightH=Math.hypot(pts[2].x-pts[1].x,pts[2].y-pts[1].y);
    const outW=Math.min(1800,Math.max(900,Math.round(Math.max(topW,botW))));
    const outH=Math.min(2600,Math.max(1200,Math.round(Math.max(leftH,rightH)*outW/Math.max(1,Math.max(topW,botW)))));
    resultCanvas.width=outW;resultCanvas.height=outH;
    const src=cv.imread(source), dst=new cv.Mat();
    const s=cv.matFromArray(4,1,cv.CV_32FC2,[pts[0].x,pts[0].y,pts[1].x,pts[1].y,pts[2].x,pts[2].y,pts[3].x,pts[3].y]);
    const d=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,outW-1,0,outW-1,outH-1,0,outH-1]);
    const M=cv.getPerspectiveTransform(s,d); cv.warpPerspective(src,dst,M,new cv.Size(outW,outH),cv.INTER_CUBIC,cv.BORDER_REPLICATE,new cv.Scalar());
    // Moderate document enhancement: mild CLAHE + very gentle unsharp mask.
    const gray=new cv.Mat();cv.cvtColor(dst,gray,cv.COLOR_RGBA2GRAY);
    const clahe=new cv.Mat();const cobj=cv.createCLAHE(2.0,new cv.Size(8,8));cobj.apply(gray,clahe);
    const smooth=new cv.Mat();cv.GaussianBlur(clahe,smooth,new cv.Size(0,0),1.0);
    const enhanced=new cv.Mat();cv.addWeighted(clahe,1.12,smooth,-0.12,0,enhanced);
    cv.cvtColor(enhanced,dst,cv.COLOR_GRAY2RGBA);cv.imshow(resultCanvas,dst);
    [src,dst,s, d,M,gray,clahe,smooth,enhanced,cobj].forEach(x=>{try{x.delete()}catch(e){}});
    const data=resultCanvas.toDataURL('image/jpeg',0.90);
    Streamlit.setComponentValue({type:'capture',image:data});
    if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
    statusText.textContent='Captured ✓';
  }catch(e){
    const data=source.toDataURL('image/jpeg',0.90); Streamlit.setComponentValue({type:'capture',image:data});
  }
}
capture.addEventListener('click',processCapture);

function waitCV(){if(window.cv&&cv.Mat){cvReady=true;return;}setTimeout(waitCV,150);}
if(window.Streamlit){Streamlit.setComponentReady();Streamlit.events.addEventListener(Streamlit.RENDER_EVENT,()=>{Streamlit.setFrameHeight(document.getElementById('app').scrollHeight);});}
waitCV();start();
</script>
</body>
</html>
